<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <form>
        <h2>Adicionar tarefa</h2>
        <div>
            <label for="tarefa">Tarefa:</label>
            <input id="tarefa" type="text" name="tarefa" placeholder="Digite a tarefa">
        </div>

        <div>
            <label>Descrição:</label>
            <textarea name="descricao" id="descricao" placeholder="Digite a descrição"></textarea>
        </div>
        <br><br>
        <div>
            <label for="categoria">Categoria:</label>
            <select name="categoria" id="categoria">
            <option value="" disabled selected hidden>Selecione a categoria da sua tarefa</option>
            <option value="trabalho">Trabalho</option>
            <option value="estudo">Estudo</option>
            <option value="pessoal">Pessoal</option>
            <option value="outros">Outros</option>
        </select>
        </div>
        <div>
            <label for="prioridade">Prioridade:</label>
            <select name="prioridade" id="prioridade">
                <option value="" disabled selected hidden>Selecione a prioridade</option>
                <option value="alta">Alta</option>
                <option value="media">Média</option>
                <option value="baixa">Baixa</option>
            </select>
        </div>
        
        <div>
            <label for="data">Data de conclusão:</label>
            <input type="date" name="data" id="data">
        </div>
        <div>
            <label for="status">Status da tarefa:</label>
            <select name="status" id="status">
                <option value="" disabled selected hidden>Selecione o status</option>
                <option value="afazer">A fazer</option>
                <option value="andamento">Em andamento</option>
                <option value="concluido">Concluido</option>
            </select>
        </div>
        <br>
        <button id="botao" type="submit">Adicionar</button>
    </form>

    <div id="filtro">
        <h3>Filtro das tarefas</h3>
            <div id="qtdTarefas">
                <div class="status-tarefa">
                    <p style="font-weight: bold;">Total tarefas: </p> 
                    <p>0</p>
                </div>
                <div class="status-tarefa">
                    <p style="color: red; font-weight: bold;">Tarefas pendentes:  </p> 
                    <p>0</p>
                </div>
                <div class="status-tarefa">
                    <p style="color: green; font-weight: bold;">Tarefas concluídas:</p> 
                    <p>0</p>
                </div>
            </div>

        <div>
        <label for="filtroAplicacao">Situação:</label>
        <select name="filtroAplicacao" id="filtroAplicacao">
            <option value="todas">Todas</option>
            <option value="pendentes">Pendentes</option>
            <option value="concluidas">Concluídas</option>
        </select>
        </div>

        <div>
        <label for="filtroCategoria">Categoria:</label>
        <select name="filtroCategoria" id="filtroCategoria">
            <option value="todas">Todas</option>
            <option value="trabalho">Trabalho</option>
            <option value="estudo">Estudo</option>
            <option value="pessoal">Pessoal</option>
            <option value="outros">Outros</option>
        </select>
        </div>

        <br>

        <div id="bloco-tarefa"></div>
    </div>


    <script src="js/script.js"></script>
</body>
</html>
